version: v0.4

project:
  name: "Boundary-only checking for the Antihydra orbit"
  description: >-
    A machine-checked incision theorem for the abstract orbit of the BB(6)
    Turing machine Antihydra: the orbit of triples (a, m, c) under its three
    exact record rules can die only on the explicit boundary set m = 0 or
    (m = 2 and a <= 1) (theorem astep_dies_iff), and the event process that
    samples the orbit only at those boundary states — skipping every
    intervening run of counter-frozen hydra steps in closed form — dies if
    and only if the full orbit dies (theorem boundary_checking_complete).
    Verifying orbit safety only at incision events is therefore certified
    sound and complete.  The acceleration is substantial in practice:
    measured against the raw machine, the first sixteen events already cover
    more than 10^8 raw Turing machine steps.  Proofs are in core Lean 4 (no
    Mathlib) and use only the axioms propext and Quot.sound.  This entry
    concerns the orbit's incision structure alone; the (separately
    submitted) machine-level reduction supplies the connection between this
    orbit and Antihydra itself, and nothing here decides any machine.
  authors:
    - "Enan Srivastava"
  responsible_maintainers:
    - "Enan Srivastava"
  license: "MIT"  # proposed; root LICENSE file pending owner decision

classification:
  arxiv: [math.LO, math.DS]
  msc2020: ["03D10", "37B10"]

