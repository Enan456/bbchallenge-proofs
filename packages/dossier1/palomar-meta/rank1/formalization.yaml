version: v0.4

project:
  name: "Rank-1 array-class machine non-halting, reduced to its word-orbit conjecture"
  description: >-
    A machine-checked reduction, in core Lean 4 (no Mathlib), of the halting
    problem of the BB(6) holdout Turing machine dossier-5
    (1RB1RD_1LC0LC_0RD0LB_1RF0LE_0RD---_0RA1RC, the rank-1 array-class
    machine, the block-trisection odometer) to the conjecture that its
    fail-closed word orbit never dies (SafeWordOrbit).  The first closure
    of the program over a growing-dimension state space: the abstract
    state is an unboundedly growing word (List Bool) plus a head offset,
    not a fixed tuple of integers.  The certified layer plays the
    machine's exact cell-level choreography — the parametric leftward
    descent (descendExec), the probe dips, the rise chunks, the turns and
    the mini-arrival floors — as an executable fail-closed pass
    (passGo/wstep) proven faithful: every `some` output is realized by
    the raw machine in exactly the returned step count, probe-safely.  A
    segment-induction keystone discharges orbit safety into non-halting
    (theorem safeWordOrbit_nonhalting).  No Faithful assumption remains:
    the conjecture is a statement about a sequence of words with no tape,
    no head, no machine.  The word calculus was validated against a
    python mirror reproducing every raw segment exactly — word, step
    count, head offset — over multi-million-step horizons.  Nothing here
    decides the machine: the word-orbit conjecture itself remains open.
  authors:
    - "Enan Srivastava"
  responsible_maintainers:
    - "Enan Srivastava <enan332@gmail.com>"
  license: "MIT"

classification:
  arxiv: [math.LO, cs.CC]
  msc2020: ["03D10"]

sources:
  - title: "The Busy Beaver Challenge (bbchallenge) BB(6) project"
    type: web discussion
    url: "https://bbchallenge.org"
    relationship: formalizes
    note: >-
      The machine 1RB1RD_1LC0LC_0RD0LB_1RF0LE_0RD---_0RA1RC is one of the
      bbchallenge BB(6) holdout set; this development formalises its
      complete sweep-level dynamics and reduces its halting problem to
      the SafeWordOrbit conjecture.
  - title: "bbchallenge deciders paper (Turing machine deciders, part I)"
    type: preprint
    url: "https://arxiv.org/abs/2504.20563"
    relationship: background

automation:
  methods:
    - method: agent
      note: >-
        Lean statements and proofs drafted by an AI coding agent (Claude,
        Anthropic) under human direction; the trisection calculus was
        discovered and validated fail-closed by the project's Python
        pipeline against multi-million-step raw horizons; all proofs
        machine-checked by Lean.

review:
  status: self-assessed
  notes: >-
    No external human review.  Self-assessment: axiom audit (compared
    theorem uses only propext and Quot.sound), differential testing of
    the word engine against independent raw emulation (permanent pytest),
    and exact segment-mirror validation of the executable pass.

claims:
  - theorem: "Rank1Challenge.safeWordOrbit_nonhalting"
    statement_informal: >-
      If the fail-closed word orbit of the rank-1 array-class machine —
      the certified sweep wstep iterated from the 1-step startup anchor
      ([1], 1) — never dies (SafeWordOrbit), then the machine
      1RB1RD_1LC0LC_0RD0LB_1RF0LE_0RD---_0RA1RC never halts from the
      all-zero tape.
    status: "conditional"
    axioms: ["propext", "Quot.sound"]

provenance:
  relationship: "original"
  notes: >-
    Original development; the machine is one of the bbchallenge BB(6)
    holdouts.  Proofs were developed in collaboration with an AI assistant
    (Claude, Anthropic); all results are checked by the Lean 4 kernel at the
    stated axiom set.
