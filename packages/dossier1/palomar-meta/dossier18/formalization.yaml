version: v0.4

project:
  name: "Dossier-18 non-halting, reduced to its record-orbit conjecture"
  description: >-
    A machine-checked reduction, in core Lean 4 (no Mathlib), of the halting
    problem of the BB(6) holdout Turing machine dossier-18
    (1RB1LD_1LC---_1RE0LD_1LC1LD_1RF0RE_1RA0RC) to the conjecture that its
    fail-closed record orbit never dies (SafeD18Orbit).  The certified layer
    is a single-raw-step word engine over the machine's record events
    (fresh tape extremes): every raw move is a certified push or pop of
    list surgery on a two-list boundary representation, the executable
    sweep (go/wstep) is proven faithful — every `some` output is realized
    by the raw machine in exactly the returned step count, probe-safely —
    failing closed only on the machine's fatal halt probe (the undefined
    transition B1) and on fuel exhaustion, and a segment-induction
    keystone discharges orbit safety into non-halting (theorem
    safeD18Orbit_nonhalting).  No Faithful assumption remains: the
    conjecture is a statement about a sequence of (state, word) pairs with
    no tape, no head, no machine.  The word calculus was validated against
    a python record mirror reproducing every record transition exactly —
    state, word, step count — over multi-million-step raw horizons.
    Nothing here decides the machine: the orbit conjecture itself remains
    open.
  authors:
    - "Enan Srivastava"
  responsible_maintainers:
    - "Enan Srivastava <enan332@gmail.com>"
  license: "MIT"

classification:
  arxiv: [math.LO, cs.CC]
  msc2020: ["03D10"]

sources:
  - title: "The Busy Beaver Challenge (bbchallenge) BB(6) project"
    type: web discussion
    url: "https://bbchallenge.org"
    relationship: formalizes
    note: >-
      The machine 1RB1LD_1LC---_1RE0LD_1LC1LD_1RF0RE_1RA0RC is one of the
      bbchallenge BB(6) holdout set; this development formalises its
      complete record-level dynamics and reduces its halting problem to
      the SafeD18Orbit conjecture.
  - title: "bbchallenge deciders paper (Turing machine deciders, part I)"
    type: preprint
    url: "https://arxiv.org/abs/2504.20563"
    relationship: background

automation:
  methods:
    - method: agent
      note: >-
        Lean statements and proofs drafted by an AI coding agent (Claude,
        Anthropic) under human direction; the record calculus was
        discovered and validated fail-closed by the project's Python
        pipeline against multi-million-step raw horizons; all proofs
        machine-checked by Lean.

review:
  status: self-assessed
  notes: >-
    No external human review.  Self-assessment: axiom audit (compared
    theorem uses only propext and Quot.sound), differential testing of
    the word engine against independent raw emulation (permanent pytest),
    and exact record-mirror validation of the executable sweep.

claims:
  - theorem: "Dossier18Challenge.safeD18Orbit_nonhalting"
    statement_informal: >-
      If the fail-closed record orbit of dossier-18 — the certified word
      machine wstep iterated from the blank anchor (A, []) — never dies
      (SafeD18Orbit), then the machine
      1RB1LD_1LC---_1RE0LD_1LC1LD_1RF0RE_1RA0RC never halts from the
      all-zero tape.
    status: "conditional"
    axioms: ["propext", "Quot.sound"]

provenance:
  relationship: "original"
  notes: >-
    Original development; the machine is one of the bbchallenge BB(6)
    holdouts.  Proofs were developed in collaboration with an AI assistant
    (Claude, Anthropic); all results are checked by the Lean 4 kernel at the
    stated axiom set.
