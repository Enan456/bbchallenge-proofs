version: v0.4

project:
  name: "Dvisetu non-halting, reduced to its checkpoint conjecture"
  description: >-
    A machine-checked reduction, in core Lean 4 (no Mathlib), of the halting
    problem of the BB(6) holdout Turing machine Dvisetu (dossier-6,
    1RB0RB_1LB0LC_1RD1LC_1RE0RA_0RF1RA_---1LB, the divide-renewal machine)
    to its checkpoint conjecture (SafeCheckpointOrbit).  The conjecture has
    two components: (i) the abstract checkpoint orbit — a fail-closed
    integer dynamical system over two-block records and one-block
    checkpoints, dispatching drift, collapse, micro and renewal episodes,
    including an iterated-division renewal — never dies, and (ii) the
    divide renewals realize their abstract outputs on the tape
    (DivideFaithful), the one episode of the timed abstract map whose
    quadratic-time choreography is not yet certified.  Every other episode
    is played on the tape by kernel-checked transport theorems over an
    exact tape grammar (Realizes), a six-step concrete startup certificate
    anchors the orbit, and a segment-induction keystone discharges
    checkpoint safety into non-halting (theorem
    safeDvisetuOrbit_nonhalting).  The abstract calculus was validated
    fail-closed against multi-million-step raw horizons; the divide
    episode is validated on every raw divide event observed, including a
    depth-2 cascade.  Nothing here decides the machine: the checkpoint
    conjecture itself remains open.
  authors:
    - "Enan Srivastava"
  responsible_maintainers:
    - "Enan Srivastava <enan332@gmail.com>"
  license: "MIT"

classification:
  arxiv: [math.LO, cs.CC]
  msc2020: ["03D10"]

sources:
  - title: "The Busy Beaver Challenge (bbchallenge) BB(6) project"
    type: web discussion
    url: "https://bbchallenge.org"
    relationship: formalizes
    note: >-
      The machine 1RB0RB_1LB0LC_1RD1LC_1RE0RA_0RF1RA_---1LB is one of the
      bbchallenge BB(6) holdout set; this development formalises its
      checkpoint-level dynamics and reduces its halting problem to the
      SafeCheckpointOrbit conjecture.
  - title: "bbchallenge deciders paper (Turing machine deciders, part I)"
    type: preprint
    url: "https://arxiv.org/abs/2504.20563"
    relationship: background

automation:
  methods:
    - method: agent
      note: >-
        Lean statements and proofs drafted by an AI coding agent (Claude,
        Anthropic) under human direction; the checkpoint calculus was
        discovered and validated fail-closed by the project's Python
        pipeline against multi-million-step raw horizons; episode and
        anchor theorems compiled by simulation-driven generators; all
        proofs machine-checked by Lean.

review:
  status: self-assessed
  notes: >-
    No external human review.  Self-assessment: axiom audit (compared
    theorem uses only propext and Quot.sound), differential testing of
    every theorem layer against independent raw emulation (permanent
    pytest), snapshot-exact validation of the abstract checkpoint mirror,
    and a six-step fully concrete startup certificate.

claims:
  - theorem: "DvisetuChallenge.safeDvisetuOrbit_nonhalting"
    statement_informal: >-
      If the abstract checkpoint orbit of Dvisetu never dies and its
      divide renewals realize their abstract outputs on the tape
      (SafeCheckpointOrbit), then the machine
      1RB0RB_1LB0LC_1RD1LC_1RE0RA_0RF1RA_---1LB never halts from the
      all-zero tape.
    status: "conditional"
    axioms: ["propext", "Quot.sound"]

provenance:
  relationship: "original"
  notes: >-
    Original development; the machine is one of the bbchallenge BB(6)
    holdouts.  Proofs were developed in collaboration with an AI assistant
    (Claude, Anthropic); all results are checked by the Lean 4 kernel at the
    stated axiom set.
