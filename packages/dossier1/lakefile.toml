name = "dossier1"
version = "0.1.0"
keywords = ["busy-beaver", "bbchallenge"]
defaultTargets = ["Bridge", "Palomar"]

[leanOptions]
relaxedAutoImplicit = false

[[require]]
name = "busy-beaver-core"
path = "../../busy-beaver-core"

[[lean_lib]]
name = "Bridge"

[[lean_lib]]
name = "Palomar"
globs = ["Palomar.+"]

[[lean_exe]]
name = "trace"
root = "Trace"
